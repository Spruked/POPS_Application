[package]
name = "proof-of-presence"
version = "1.0.0"
description = "Legal case management with persistent evidence vault"
authors = ["You"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.70"

[lib]
# Tauri 2 mobile: the app is built as a library that Android/iOS load natively.
name = "proof_of_presence_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.30", features = ["bundled", "backup"] }
# Vault Transfer packages (pure Rust deflate; builds for Android/iOS)
zip = { version = "2", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", features = ["serde"] }
# Court-local time zones for reminders (bundled IANA database, works offline on mobile)
chrono-tz = "0.10"
# Desktop <-> phone sync: authenticated encryption + pairing secrets
chacha20poly1305 = "0.10"
hmac = "0.12"
base64 = "0.22"
rand = "0.8"
uuid = { version = "1.6", features = ["v4", "serde"] }
# Per-device signing identity (Sync Engine S0, decision D3)
ed25519-dalek = { version = "2", features = ["rand_core"] }
# Read-only EXIF parsing for capture metadata (C1). Parses from a byte slice; never writes.
kamadak-exif = "0.6"
sha2 = "0.10"
hex = "0.4"
# rustls avoids cross-compiling OpenSSL for Android/iOS
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"

# Mobile-only: GPS for camera evidence (plugin has no desktop backend)
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-geolocation = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Development-only plain-file device key store (decision D4). Refused in release builds by a
# compile_error! in device_keys.rs; release builds get an OS-backed store in S2.
dev-keystore = []

[workspace]
