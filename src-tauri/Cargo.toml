[package]
name = "proof-of-presence"
version = "1.0.0"
description = "Legal case management with persistent evidence vault"
authors = ["You"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.70"

[lib]
# Tauri 2 mobile: the app is built as a library that Android/iOS load natively.
name = "proof_of_presence_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.30", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
# rustls avoids cross-compiling OpenSSL for Android/iOS
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"

# Mobile-only: GPS for camera evidence (plugin has no desktop backend)
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-geolocation = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[workspace]
