[package]
name = "tpc-substrate"
version = "1.0.0"
edition = "2021"
authors = ["Bryan Anthony Spruk"]
description = "Triple Predicate Cubed — Rust Memory & Recursion Substrate"

[dependencies]
tokio = { version = "1.35", features = ["full", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
numpy = "0.21"
ndarray = { version = "0.15", features = ["serde", "rayon"] }
rayon = "1.8"
parking_lot = "0.12"
dashmap = "5.5"
crossbeam = "0.8"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"

# Python interop
pyo3 = { version = "0.20", features = ["extension-module", "abi3-py38"] }
pyo3-asyncio = { version = "0.20", features = ["tokio-runtime"] }

[lib]
name = "tpc_substrate"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "tpc-daemon"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
