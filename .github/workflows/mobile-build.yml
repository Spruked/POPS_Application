name: POPS mobile build

on:
  push:
    branches: [mobile-tauri-v2]
  pull_request:
    branches: [mobile-tauri-v2]
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20

jobs:
  validate:
    name: Frontend + desktop Rust gate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - name: Linux WebKit deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - run: npm run build
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  android:
    name: Android APK
    needs: validate
    runs-on: ubuntu-latest
    env:
      ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      # The legacy "tools" package was removed from Google's repository; install only what's needed.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - name: Generate mobile icons from POPS badge
        run: npx tauri icon public/popsbadge.png
      - name: Init Android project
        run: npx tauri android init --ci
      - name: Declare camera, location + exact-alarm permissions (evidence capture, court reminders)
        run: |
          MANIFEST=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          for PERM in CAMERA ACCESS_COARSE_LOCATION ACCESS_FINE_LOCATION USE_EXACT_ALARM; do
            grep -q "android.permission.$PERM\"" "$MANIFEST" || sed -i "s#<application#<uses-permission android:name=\"android.permission.$PERM\" />\n    <application#" "$MANIFEST"
          done
          # Android 12 (API 31-32) needs SCHEDULE_EXACT_ALARM; 13+ uses USE_EXACT_ALARM (calendar/reminder apps).
          grep -q "SCHEDULE_EXACT_ALARM" "$MANIFEST" || sed -i "s#<application#<uses-permission android:name=\"android.permission.SCHEDULE_EXACT_ALARM\" android:maxSdkVersion=\"32\" />\n    <application#" "$MANIFEST"
          grep -n "uses-permission" "$MANIFEST"
      # Installable test build (signed with the Android debug key, bundles the production frontend)
      - name: Build debug APK (installable for device testing)
        run: npx tauri android build --ci --apk --debug --target aarch64 --target x86_64
      # The minimum supported Android version is 8.0 (API 26), set in tauri.conf.json.
      # Fail the build if the generated APK declares anything else.
      - name: Verify APK minimum SDK is 26
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "app-universal-debug.apk" | head -1)
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort | tail -1)
          SDK=$("$AAPT2" dump badging "$APK" | sed -n "s/^sdkVersion:'\([0-9]*\)'.*/\1/p")
          echo "APK=$APK minSdk=$SDK"
          test "$SDK" = "26"
      # Release signing. Repository secrets (Settings -> Secrets and variables -> Actions):
      #   ANDROID_KEY_BASE64   base64 of the upload keystore (.jks)
      #   ANDROID_KEY_ALIAS    key alias inside the keystore
      #   ANDROID_KEY_PASSWORD store/key password
      # Without them the release outputs stay unsigned (the debug APK above is still installable).
      - name: Configure release signing
        if: ${{ env.ANDROID_KEY_BASE64 != '' }}
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/pops-upload.jks"
          {
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "password=$ANDROID_KEY_PASSWORD"
            echo "storeFile=$RUNNER_TEMP/pops-upload.jks"
          } > src-tauri/gen/android/keystore.properties
          python3 scripts/ci/android_signing.py
      # versionCode must increase on every Play upload: 1.0.0 -> 1000000, plus the CI run number.
      - name: Build release APK + AAB (signed when secrets are set)
        run: |
          VERSION_CODE=$((1000000 + ${{ github.run_number }}))
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          npx tauri android build --ci --config "{\"bundle\":{\"android\":{\"versionCode\":$VERSION_CODE}}}"
      # Play internal testing upload. Needs secret PLAY_SERVICE_ACCOUNT_JSON (Play Console → Setup → API access).
      # Repository variable PLAY_RELEASE_STATUS: "draft" until the app's first review is done, then "completed".
      - name: Upload to Google Play internal testing
        if: ${{ env.PLAY_SERVICE_ACCOUNT_JSON != '' && env.ANDROID_KEY_BASE64 != '' && github.event_name == 'push' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.proofofpresence.app
          releaseFiles: src-tauri/gen/android/app/build/outputs/bundle/universalRelease/app-universal-release.aab
          track: internal
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
          releaseName: "POPS ${{ env.VERSION_CODE }}"
      - uses: actions/upload-artifact@v4
        with:
          name: pops-android
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab

  android-smoke:
    name: Android emulator smoke test (API ${{ matrix.api-level }})
    needs: android
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 26 = Android 8.0, the oldest version POPS installs on; 33 = Android 13.
        api-level: [26, 33]
    steps:
      - uses: actions/download-artifact@v4
        with: { name: pops-android, path: artifact }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Boot emulator, install debug APK, launch POPS
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            APK=$(find artifact -name "app-universal-debug.apk" | head -1); echo "APK=$APK"; adb install -r -g "$APK"
            adb logcat -c
            adb emu geo fix -104.990251 39.7392358
            adb shell monkey -p com.proofofpresence.app -c android.intent.category.LAUNCHER 1
            sleep 45
            adb shell pidof com.proofofpresence.app > pid.txt || true
            adb exec-out screencap -p > pops-launch.png
            adb logcat -d > logcat.txt
            adb shell dumpsys package com.proofofpresence.app | grep -E "permission\.(CAMERA|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|POST_NOTIFICATIONS|USE_EXACT_ALARM|SCHEDULE_EXACT_ALARM|RECEIVE_BOOT_COMPLETED)" > permissions.txt || true
            adb shell dumpsys package com.google.android.webview | grep -m1 versionName > webview.txt || true
            echo "--- webview:"; cat webview.txt
            echo "--- pid:"; cat pid.txt; echo "--- permissions:"; cat permissions.txt
            echo "--- crash scan:"; grep -nE "FATAL EXCEPTION|panicked at|AndroidRuntime: Process: com.proofofpresence.app" logcat.txt || echo "no crashes"
            test -s pid.txt
            ! grep -qE "FATAL EXCEPTION|panicked at" logcat.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pops-android-smoke-api${{ matrix.api-level }}
          path: |
            webview.txt
            pops-launch.png
            logcat.txt
            permissions.txt

  ios:
    name: iOS
    needs: validate
    runs-on: macos-latest
    env:
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - run: npm run build
      - name: Rust core compiles for iOS device
        run: cargo build --manifest-path src-tauri/Cargo.toml --lib --target aarch64-apple-ios
      # `tauri ios init` needs an Apple team; without one the job ends at the Rust compile gate above.
      - name: Generate mobile icons from POPS badge
        if: ${{ env.APPLE_DEVELOPMENT_TEAM != '' }}
        run: npx tauri icon public/popsbadge.png
      - name: Init iOS project
        if: ${{ env.APPLE_DEVELOPMENT_TEAM != '' }}
        run: npx tauri ios init --ci
      # Signed IPA only when an Apple team + App Store Connect API key are configured.
      - name: Build signed IPA
        if: ${{ env.APPLE_DEVELOPMENT_TEAM != '' }}
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: |
          echo "${{ secrets.APPLE_API_KEY_P8 }}" > "$APPLE_API_KEY_PATH"
          npx tauri ios build --ci --export-method app-store-connect
      # Optional: send the signed IPA to TestFlight (needs the same App Store Connect key).
      - name: Upload to TestFlight
        if: ${{ env.APPLE_DEVELOPMENT_TEAM != '' && vars.IOS_UPLOAD_TESTFLIGHT == 'true' }}
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APPLE_API_KEY_P8 }}" > ~/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY}.p8
          IPA=$(find src-tauri/gen/apple/build -name "*.ipa" | head -1)
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"
      - uses: actions/upload-artifact@v4
        if: ${{ env.APPLE_DEVELOPMENT_TEAM != '' }}
        with:
          name: pops-ios
          path: src-tauri/gen/apple/build/**/*.ipa
